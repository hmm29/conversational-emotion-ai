# Which response approach to use for which detected emotion.
#
# The dominant emotion of each message is looked up here. Emotion names are
# lower-case and follow Hume AI's language model (and the keyword matcher).
# An emotion that is not listed, or one scoring under 0.1, gets the
# "balanced_engagement" approach.
#
# Approaches: amplify_positive, gentle_encouragement, empathetic_support,
# balanced_engagement. Their prompts live in src/response_generator.py.

response_strategies:
  high_positive:
    approach: amplify_positive
    emotions: [joy, excitement, amusement, enthusiasm, ecstasy, pride, triumph, gratitude, love, admiration]

  moderate_positive:
    approach: gentle_encouragement
    emotions: [contentment, interest, satisfaction, calmness, relief, determination]

  negative:
    approach: empathetic_support
    emotions: [sadness, anger, fear, disappointment, shame, anxiety, distress, annoyance, guilt, embarrassment, tiredness, pain]
